plugins {
    id 'application'
}

group = 'br.com.superrpg'
version = '2.0.0-alpha.7-SNAPSHOT'

repositories { mavenCentral() }

def os = System.getProperty('os.name').toLowerCase()
def arm = System.getProperty('os.arch') in ['aarch64', 'arm64']
def platform = os.contains('mac') ? (arm ? 'mac-aarch64' : 'mac') : os.contains('win') ? 'win' : (arm ? 'linux-aarch64' : 'linux')

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    ['base', 'graphics', 'controls'].each { module ->
        implementation "org.openjfx:javafx-${module}:21.0.9:${platform}"
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
application {
    mainModule = 'br.com.superrpg'
    mainClass = 'br.com.superrpg.ui.Iniciar'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}
test { useJUnitPlatform() }

// App-image inclui o runtime: não depende de Java instalado pelo jogador.
// Cada sistema/arquitetura deve gerar o próprio pacote.
def nativeDir = layout.buildDirectory.dir('native')
def appName = 'SuperRPG'
def appDir = nativeDir.map { it.dir(os.contains('mac') ? "${appName}.app" : appName) }
tasks.register('cleanNativeApp', Delete) {
    // Somente o aplicativo gerado; nunca a pasta de saves do jogador.
    delete(appDir)
}
tasks.register('packageApp', Exec) {
    group = 'distribution'
    description = 'Gera aplicativo nativo com Java incluído para o sistema atual.'
    dependsOn installDist, tasks.named('cleanNativeApp')
    inputs.dir(layout.buildDirectory.dir('install/super-rpg'))
    inputs.property('releaseVersion', project.version.toString())
    inputs.property('runtimeVersion', System.getProperty('java.runtime.version'))
    // Gradle cria diretórios de saída antes de executar a tarefa; jpackage exige
    // que o aplicativo ainda não exista, então declaramos apenas o diretório pai.
    outputs.dir(nativeDir)
    commandLine new File(System.getProperty('java.home'), "bin/jpackage${os.contains('win') ? '.exe' : ''}"),
            '--type', 'app-image', '--name', appName,
            '--dest', nativeDir.get().asFile,
            '--module-path', layout.buildDirectory.dir('install/super-rpg/lib').get().asFile,
            '--module', 'br.com.superrpg/br.com.superrpg.ui.Iniciar',
            '--app-version', project.version.toString().split('-')[0],
            '--description', "SuperRPG ${project.version} — prévia gráfica",
            '--vendor', 'luigigiarola-dev',
            '--java-options', '--enable-native-access=javafx.graphics'
}
tasks.register('packageBundle', Copy) {
    group = 'distribution'
    description = 'Gera aplicativo com Java incluído, instruções e licenças.'
    dependsOn tasks.named('packageApp')
    from('LICENSE')
    from('docs/DISTRIBUICAO.md')
    from('licenses') { into 'terceiros' }
    into(nativeDir.map { it.dir('documentacao') })
}
tasks.register('console', JavaExec) {
    group = 'application'
    description = 'Executa a versão de terminal migrada.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'br.com.superrpg.jogo.SuperRpgTerminal'
    standardInput = System.in
}
